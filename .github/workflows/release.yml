name: Release

# Se dispara al publicar una etiqueta vX.Y.Z y genera los paquetes de Windows y
# Linux. macOS queda fuera a proposito.
#
# Estado de la firma: los artefactos salen SIN FIRMAR. El paso de firma de
# Windows esta escrito y comentado; alcanza con cargar los secretos para
# activarlo (AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (instalador .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Pruebas
        run: |
          python tests/test_estructura.py
          python tests/test_construccion.py

      - name: Empaquetar con PyInstaller
        run: python -m PyInstaller packaging/fontiador.spec --noconfirm --distpath dist --workpath build

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      # Cuando haya certificado, descomentar para firmar antes de empaquetar.
      # - name: Firmar el ejecutable
      #   if: ${{ secrets.AZURE_CLIENT_ID != '' }}
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: https://eus.codesigning.azure.net/
      #     trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
      #     certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
      #     files-folder: dist/Fontiador

      - name: Compilar el instalador
        run: iscc packaging/windows/fontiador.iss

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/installer/*.exe
            dist/installer/*.exe.sha256

  # ------------------------------------------------------------------ Linux
  linux:
    name: Linux (AppImage y .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.0 libfuse2 rpm
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Pruebas
        run: |
          python tests/test_estructura.py
          python tests/test_construccion.py

      - name: Empaquetar
        run: python -m PyInstaller packaging/fontiador.spec --noconfirm --distpath dist --workpath build

      - name: Armar el AppDir y el AppImage
        run: |
          bash packaging/linux/build-appimage.sh

      - name: Armar el .deb y el .rpm
        run: |
          bash packaging/linux/build-packages.sh

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/installer/*.AppImage
            dist/installer/*.deb
            dist/installer/*.rpm

  # ----------------------------------------------------------------- Release
  publicar:
    name: Publicar la version
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Calcular sumas de verificacion
        run: |
          cd artefactos
          find . -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec sha256sum {} \; | sed 's|  \./|  |' > SHA256SUMS
          cat SHA256SUMS

      # El tag ya tiene una release publicada (la de Windows), asi que este paso
      # tiene que ACTUALIZARLA, no crear una nueva: GitHub rechaza dos releases
      # sobre el mismo tag. Y no se regeneran las notas, para no pisar las que
      # ya estan escritas.
      - name: Publicar la version
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artefactos/**/*.exe
            artefactos/**/*.AppImage
            artefactos/**/*.deb
            artefactos/**/*.rpm
            artefactos/SHA256SUMS
          fail_on_unmatched_files: false
          generate_release_notes: false
          draft: false
